<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Matt Benjamin</title>
  <script>
    // GitHub Pages SPA redirect trick.
    // When GitHub Pages serves a 404 for a deep link (e.g. /books),
    // this page encodes the path into the query string and redirects to
    // index.html, which then restores the original URL via the script below.
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1).join('/') +
      '/?p=' + encodeURIComponent(l.pathname + l.search) +
      (l.hash || '')
    );
  </script>
</head>
<body></body>
</html>
