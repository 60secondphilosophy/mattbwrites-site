<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <!-- GitHub Pages SPA deep-link restore: reads ?p= set by 404.html -->
    <script>
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        // Also handle the ?p= query param approach
        var search = window.location.search;
        if (search) {
          var params = new URLSearchParams(search);
          var p = params.get('p');
          if (p) {
            window.history.replaceState(null, null, p);
          }
        }
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Matt Benjamin | Author</title>
    <meta name="description" content="Matt Benjamin is an author of free fiction and Christian non-fiction. Download his books free — pay what they're worth to you." />
    <meta property="og:site_name" content="Matt Benjamin" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://mattbwrites.com/images/real-author-photo.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
